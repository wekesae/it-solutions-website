ignoreLogs = ['warning-goldmark-raw-html']
baseURL = "https://wekesae.github.io/it-solutions-website/"
languageCode = "en-us"
title = "IT Solutions"
theme = "hugo-hero-theme"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.92.0"
    
[params]
  google_analytics_id=""
  zerostatic = false

  [params.logo]
  mobile = "images/IT-Solutions.png"
  mobile_height = "36px"
  mobile_width = "auto"
  desktop = "images/IT-Solutions.png"
  desktop_height = "35px"
  desktop_width = "auto"
  alt = "IT Solutions Logo"

  [params.homepage_meta_tags]
    meta_description = "IT Solutions and Systems Engineering services including VoIP telephony, call center setup, POS systems, and network infrastructure."
    meta_og_title = "IT Solutions"
    meta_og_type = "website"
    meta_og_url = "https://wekesae.github.io/it-solutions-website/"
    meta_og_image = "images/IT-Solutions.png"
    meta_og_description = "Reliable VoIP, telephony, Linux infrastructure, and enterprise IT services."
    meta_twitter_card = "summary"
    meta_twitter_site = "@zerostaticio"
    meta_twitter_creator = "@zerostaticio"

[[menu.main]]
	name = "Services"
	url = "/services/"
    weight = 1

[[menu.main]]
    name = "Work"
    url = "/work/"
    weight = 2

[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[[menu.main]]
    name = "History"
    url = "/history/"
    weight = 3

[[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 4

[permalinks]
  post = "/:year/:month/:day/:slug/"
  pages = "/:contentbasename/"
